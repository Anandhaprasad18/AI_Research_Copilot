app = "ai-research-copilot"
kill_signal = "SIGINT"
kill_timeout = 5

[env]
  PORT = "8000"

[[mounts]]
  source = "ai_data"
  destination = "/app/data"

[[services]]
  internal_port = 8000
  protocol = "tcp"
  processes = ["app"]
  [[services.ports]]
    handlers = ["http"]
    port = 80
  [[services.ports]]
    handlers = ["tls"]
    port = 443
